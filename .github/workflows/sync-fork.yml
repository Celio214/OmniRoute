name: Sync Fork

on:
  schedule:
    # S'exécute automatiquement toutes les semaines (le dimanche à minuit)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permet de lancer la synchronisation manuellement depuis l'interface GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour pousser les changements sur votre branche

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Utilise la CLI GitHub pour synchroniser directement le fork avec le parent
          gh repo sync ${{ github.repository }} --branch main
